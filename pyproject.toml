[project]
name = "portolan-python"
version = "0.1.0"
description = "A lightweight Python implementation of the Portolan specification."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Portolan contributors" },
]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.18.0",
  "pytest>=8.0.0",
  "ruff>=0.13.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "unit: fast isolated tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/portolan"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
